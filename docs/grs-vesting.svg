<?xml version="1.0" encoding="UTF-8"?>
<!-- GRS vesting schedule - 1B supply - August 2026 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 424" width="100%" role="img" aria-label="GRS vesting schedule, 1B GRS">
  <defs>
    <pattern id="cliffHatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#111827" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>
    <pattern id="govHatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#111827" stroke-opacity="0.22" stroke-width="1.5"/>
    </pattern>
    <pattern id="propHatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <line x1="0" y1="3" x2="6" y2="3" stroke="#111827" stroke-opacity="0.22" stroke-width="0.6"/>
    </pattern>
    <style>
      .title { font: 650 18px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #111827; }
      .subtitle { font: 400 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #6b7280; }
      .label { font: 600 11px ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .meta { font: 400 10px ui-sans-serif, system-ui, -apple-system, sans-serif; opacity: 0.8; }
      .row { font: 500 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #374151; }
      .tick { font: 400 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6b7280; }
      .barNote { font: 500 9px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .barNoteDark { font: 500 9px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #92400e; }
    </style>
  </defs>

  <rect width="920" height="424" fill="#fafbfc" rx="12"/>
  <rect x="0.5" y="0.5" width="919" height="423" fill="none" stroke="#e5e7eb" rx="12"/>

  <text x="460" y="28" text-anchor="middle" class="title">GRS vesting schedule</text>
  <text x="460" y="44" text-anchor="middle" class="subtitle">TGE → 72m · ∞ · 1 season ≈ 1 month</text>

  <!-- Key -->
  <g transform="translate(24, 56)">
    <rect x="0" y="0" width="872" height="52" rx="8" fill="#ffffff" stroke="#e5e7eb"/>

    <rect x="12" y="14" width="16" height="10" rx="2" fill="#0ea5e9" opacity="0.35"/>
    <rect x="12" y="14" width="16" height="10" rx="2" fill="url(#cliffHatch)"/>
    <text x="34" y="16" class="label">Cliff</text>
    <text x="34" y="32" class="meta">locked until cliff ends</text>

    <line x1="168" y1="10" x2="168" y2="42" stroke="#e5e7eb"/>

    <rect x="180" y="14" width="16" height="10" rx="2" fill="#0ea5e9"/>
    <text x="202" y="16" class="label">Linear vesting</text>
    <text x="202" y="32" class="meta">time-based unlock</text>

    <line x1="328" y1="10" x2="328" y2="42" stroke="#e5e7eb"/>

    <rect x="340" y="14" width="16" height="10" rx="2" fill="#ec4899" opacity="0.35"/>
    <rect x="340" y="14" width="16" height="10" rx="2" fill="url(#govHatch)"/>
    <text x="362" y="16" class="label">Vote-gated</text>
    <text x="362" y="32" class="meta">GRS governance</text>

    <line x1="500" y1="10" x2="500" y2="42" stroke="#e5e7eb"/>

    <rect x="512" y="14" width="16" height="10" rx="2" fill="#f472b6" opacity="0.35"/>
    <rect x="512" y="14" width="16" height="10" rx="2" fill="url(#propHatch)"/>
    <text x="534" y="16" class="label">Proprietary-gated</text>
    <text x="534" y="32" class="meta">Revenue-based release</text>

    <line x1="712" y1="10" x2="712" y2="42" stroke="#e5e7eb"/>

    <text x="724" y="23" class="label" font-size="14">∞</text>
    <text x="746" y="16" class="label">Open-ended</text>
    <text x="746" y="32" class="meta">no fixed date</text>
  </g>

  <g transform="translate(0, 116)">
    <g stroke="#eef2f7" stroke-width="1">
      <line x1="168" y1="18" x2="168" y2="204"/>
      <line x1="225.0" y1="18" x2="225.0" y2="204"/>
      <line x1="282.0" y1="18" x2="282.0" y2="204"/>
      <line x1="339.0" y1="18" x2="339.0" y2="204"/>
      <line x1="396.0" y1="18" x2="396.0" y2="204"/>
      <line x1="510.0" y1="18" x2="510.0" y2="204"/>
      <line x1="624.0" y1="18" x2="624.0" y2="204"/>
      <line x1="738.0" y1="18" x2="738.0" y2="204"/>
      <line x1="852.0" y1="18" x2="852.0" y2="204"/>
      <line x1="896" y1="18" x2="896" y2="204"/>
    </g>
    <line x1="168" y1="18" x2="168" y2="204" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="896" y1="18" x2="896" y2="204" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="3 3"/>

    <text x="168" y="12" class="tick" fill="#b45309" font-weight="700">TGE</text>
    <text x="225.0" y="12" text-anchor="middle" class="tick">6m</text>
    <text x="282.0" y="12" text-anchor="middle" class="tick">12m</text>
    <text x="339.0" y="12" text-anchor="middle" class="tick">18m</text>
    <text x="396.0" y="12" text-anchor="middle" class="tick">24m</text>
    <text x="510.0" y="12" text-anchor="middle" class="tick">36m</text>
    <text x="624.0" y="12" text-anchor="middle" class="tick">48m</text>
    <text x="738.0" y="12" text-anchor="middle" class="tick">60m</text>
    <text x="852.0" y="12" text-anchor="middle" class="tick">72m</text>
    <text x="896" y="12" text-anchor="end" class="tick">∞</text>

    <text x="160" y="32" text-anchor="end" class="row">Token sales</text>
    <rect x="168" y="22" width="728" height="12" rx="3" fill="#047857"/>
    <text x="176" y="31" class="barNote">15% TGE · no vesting</text>

    <text x="160" y="52" text-anchor="end" class="row">Pre-seed</text>
    <rect x="168" y="42" width="228.0" height="12" rx="3" fill="#059669"/>
    <text x="176" y="51" class="barNote">no cliff · 24m linear</text>

    <text x="160" y="72" text-anchor="end" class="row" font-size="10">Revenue Share Program</text>
    <rect x="168" y="62" width="728" height="12" rx="3" fill="#db2777" opacity="0.35"/>
    <rect x="168" y="62" width="728" height="12" rx="3" fill="url(#propHatch)"/>
    <text x="176" y="71" class="barNote">15% TGE · proprietary-gated · ∞</text>

    <text x="160" y="92" text-anchor="end" class="row">Airdrops</text>
    <rect x="168" y="82" width="636.5" height="12" rx="3" fill="#f87171" opacity="0.35"/>
    <rect x="168" y="82" width="636.5" height="12" rx="3" fill="url(#propHatch)"/>
    <text x="176" y="91" class="barNote">5% TGE · proprietary-gated · 67 seasons</text>

    <text x="160" y="112" text-anchor="end" class="row">Core team</text>
    <rect x="168" y="102" width="684.0" height="12" rx="3" fill="#0ea5e9"/>
    <rect x="168" y="102" width="114.0" height="12" rx="3" fill="#0ea5e9" opacity="0.35"/>
    <rect x="168" y="102" width="114.0" height="12" rx="3" fill="url(#cliffHatch)"/>
    <text x="290.0" y="111" class="barNote">12m cliff · 60m linear</text>

    <text x="160" y="132" text-anchor="end" class="row">Advisors</text>
    <rect x="168" y="122" width="684.0" height="12" rx="3" fill="#38bdf8"/>
    <rect x="168" y="122" width="57.0" height="12" rx="3" fill="#38bdf8" opacity="0.35"/>
    <rect x="168" y="122" width="57.0" height="12" rx="3" fill="url(#cliffHatch)"/>
    <text x="233.0" y="131" class="barNote">6m cliff · 66m linear</text>

    <text x="160" y="152" text-anchor="end" class="row">Growth Fund</text>
    <rect x="168" y="142" width="728" height="12" rx="3" fill="#ec4899" opacity="0.35"/>
    <rect x="168" y="142" width="728" height="12" rx="3" fill="url(#govHatch)"/>
    <text x="176" y="151" class="barNote">10% TGE · vote-gated · ∞</text>

    <text x="160" y="172" text-anchor="end" class="row">LP &amp; MM</text>
    <rect x="168" y="162" width="728" height="12" rx="3" fill="#f472b6" opacity="0.35"/>
    <rect x="168" y="162" width="728" height="12" rx="3" fill="url(#propHatch)"/>
    <text x="176" y="171" class="barNote">10% TGE · proprietary-gated · ∞</text>

    <text x="160" y="192" text-anchor="end" class="row">Foundation</text>
    <rect x="168" y="182" width="182" height="12" rx="3" fill="#42405f"/>
    <rect x="350" y="182" width="546" height="12" rx="3" fill="#2d2a45" opacity="0.45"/>
    <rect x="350" y="182" width="546" height="12" rx="3" fill="url(#govHatch)"/>
    <text x="176" y="191" class="barNote">5% TGE · remainder vote-gated · ∞</text>

    <line x1="168" y1="204" x2="896" y2="204" stroke="#d1d5db" stroke-width="1"/>

  </g>
  <g transform="translate(24, 338)">
    <text x="0" y="14" class="row"><tspan font-weight="600" fill="#111827">Circulation on TGE</tspan><tspan dx="10" font-weight="700" fill="#111827">200M · 20%</tspan><tspan dx="14" fill="#6b7280">Token sales 15% + Foundation 5% — free float</tspan></text>
    <text x="0" y="34" class="row"><tspan font-weight="600" fill="#111827">Gated on TGE</tspan><tspan dx="10" font-weight="700" fill="#111827">400M · 40%</tspan><tspan dx="14" fill="#6b7280">Revenue Share 15% + Airdrops 5% + Growth 10% + LP &amp; MM 10% — not free float</tspan></text>
    <text x="0" y="54" class="row"><tspan font-weight="600" fill="#111827">Remaining</tspan><tspan dx="10" font-weight="700" fill="#111827">400M · 40%</tspan><tspan dx="14" fill="#6b7280">Vesting 25% (Pre-seed, Team) + Foundation remainder 15%</tspan></text>
  </g>
</svg>
