    <rect x="523.2" y="50" width="174.4" height="125" fill="#ec4899" rx="4"/>
    <text x="539.2" y="74" class="label light">Growth Fund</text>
    <text x="539.2" y="92" class="pct light">10% / 100M GRS</text>
    <text x="539.2" y="110" class="meta light">Partnerships, incentives</text>
    <text x="539.2" y="126" class="meta light">&amp; marketing</text>
    <rect x="523.2" y="175" width="174.4" height="125" fill="#f472b6" rx="4"/>
    <text x="539.2" y="199" class="label light">Liquidity Providing</text>
    <text x="539.2" y="213" class="label light">&amp; Market Makers</text>
    <text x="539.2" y="229" class="pct light">10% / 100M GRS</text>
    <text x="539.2" y="247" class="meta light">GRS market liquidity</text>

    <!-- Foundation 20% -->
    <rect x="697.6" y="0" width="174.4" height="300" fill="#1e1b2e" rx="6"/>
    <text x="713.6" y="26" class="group light">Foundation</text>
