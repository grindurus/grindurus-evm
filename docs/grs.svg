<!-- GRS genesis cap table + vesting - 1B supply - August 2026 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 808" width="100%" role="img" aria-label="GRS genesis allocation treemap and vesting schedule, 1B GRS">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
    <pattern id="cliffHatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#111827" stroke-opacity="0.18" stroke-width="2"/>
    </pattern>
    <pattern id="propHatch" patternUnits="userSpaceOnUse" width="6" height="6">
      <line x1="0" y1="3" x2="6" y2="3" stroke="#111827" stroke-opacity="0.22" stroke-width="0.6"/>
    </pattern>
    <style>
      .title { font: 650 18px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #111827; }
      .section { font: 650 14px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #111827; }
      .subtitle { font: 400 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #6b7280; }
      .group { font: 600 11px ui-sans-serif, system-ui, -apple-system, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.75; }
      .label { font: 600 11px ui-sans-serif, system-ui, -apple-system, sans-serif; }
      .pct { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .amt { font: 400 11px ui-monospace, SFMono-Regular, Menlo, monospace; opacity: 0.92; }
      .meta { font: 400 10px ui-sans-serif, system-ui, -apple-system, sans-serif; opacity: 0.8; }
      .row { font: 500 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #374151; }
      .tick { font: 400 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #6b7280; }
      .legend { font: 400 10px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #4b5563; }
      .barNote { font: 500 9px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .barNoteDark { font: 500 9px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #92400e; }
      .keyTitle { font: 600 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #111827; }
      .keyBody { font: 400 10px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #6b7280; }
      .light { fill: #ffffff; }
    </style>
  </defs>

  <rect width="920" height="808" fill="#fafbfc" rx="12"/>
  <rect x="0.5" y="0.5" width="919" height="807" fill="none" stroke="#e5e7eb" rx="12"/>

  <text x="460" y="28" text-anchor="middle" class="title">1B GRS / 100%</text>
  <text x="460" y="44" text-anchor="middle" class="subtitle">GRS genesis allocation</text>

