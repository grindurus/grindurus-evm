    <text x="364.8" y="26" class="group light">Team</text>
    <text x="364.8" y="42" class="pct light">20% / 200M GRS</text>
    <rect x="348.8" y="50" width="174.4" height="188" fill="#0ea5e9" rx="4"/>
    <text x="364.8" y="74" class="label light">Core Team</text>
    <text x="364.8" y="92" class="pct light">15% / 150M GRS</text>
    <rect x="348.8" y="238" width="174.4" height="62" fill="#38bdf8" rx="4"/>
    <text x="364.8" y="258" class="label light">Advisors</text>
    <text x="364.8" y="274" class="pct light">5% / 50M GRS</text>

