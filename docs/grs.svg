  <line x1="24" y1="364" x2="24" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <line x1="198.4" y1="364" x2="198.4" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <line x1="372.8" y1="364" x2="372.8" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <line x1="547.2" y1="364" x2="547.2" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <line x1="721.6" y1="364" x2="721.6" y2="372" stroke="#d1d5db" stroke-width="1"/>
  <line x1="896" y1="364" x2="896" y2="372" stroke="#d1d5db" stroke-width="1"/>
