<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1236 824" width="100%" role="img" aria-label="Grindurus protocol: locker, voter, briber, referrer, poacher">
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="8" markerHeight="6" orient="auto">
      <path d="M0,1 L9,4 L0,7 z" fill="#4b5563"/>
    </marker>
    <marker id="arrowGreen" markerUnits="userSpaceOnUse" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="11" markerHeight="9" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#065f46"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#111827" flood-opacity="0.08"/>
    </filter>
    <g id="human">
      <circle cx="16" cy="8" r="6.5"/>
      <path d="M16 16.5c-8 0-14.5 5.2-14.5 13.2V39h29V29.7c0-8-6.5-13.2-14.5-13.2z"/>
    </g>
    <style>
      .h { font: 700 16px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .p { font: 400 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #ffffff; opacity: 0.92; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
      .ah { font: 700 15px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #111827; }
      .ap { font: 400 11px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #4b5563; }
      .am { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #374151; }
      .flow { font: 650 10px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #374151; }
      .flowg { font: 650 10px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #065f46; }
      .wire { fill: none; stroke: #4b5563; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .wireg { fill: none; stroke: #065f46; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .note { font: 400 10px ui-sans-serif, system-ui, -apple-system, sans-serif; fill: #6b7280; }
      .cut { font: 650 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #111827; }
      .pct { font: 700 18px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #111827; }
    </style>
  </defs>

  <rect width="1236" height="824" fill="#fafbfc" rx="12"/>
  <rect x="0.5" y="0.5" width="1235" height="823" fill="none" stroke="#e5e7eb" rx="12"/>

  <!-- Voter / Briber / Grinders -->
  <g filter="url(#shadow)">
    <rect x="28" y="28" width="340" height="84" rx="32" fill="#f5f3ff" stroke="#6d28d9"/>
    <use href="#human" x="44" y="50" fill="#6d28d9"/>
    <text x="92" y="56" class="ah">Voter</text>
    <text x="92" y="80" class="am">vote()</text>
    <text x="92" y="96" class="ap">no dividends on voted</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="448" y="28" width="340" height="84" rx="32" fill="#fff7ed" stroke="#c2410c"/>
    <use href="#human" x="464" y="50" fill="#c2410c"/>
    <text x="512" y="56" class="ah">Briber</text>
    <text x="512" y="80" class="am">bribe()</text>
    <text x="512" y="96" class="ap">settlementAsset</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="868" y="28" width="340" height="84" rx="4" fill="#4f46e5"/>
    <text x="884" y="56" class="h">Grinders</text>
    <text x="884" y="80" class="p">reserve + custodian NFTs</text>
    <text x="884" y="96" class="mono">allocate / deallocate</text>
  </g>

  <line x1="448" y1="70" x2="372" y2="70" class="wire" marker-end="url(#arrow)"/>
  <rect x="388" y="46" width="40" height="16" rx="4" fill="#fafbfc"/>
  <text x="408" y="58" text-anchor="middle" class="flow">bribe</text>

  <!-- Locker / GRAI / Custodian -->
  <g filter="url(#shadow)">
    <rect x="28" y="168" width="340" height="80" rx="32" fill="#e0e7ff" stroke="#1e3a8a"/>
    <use href="#human" x="44" y="188" fill="#1e3a8a"/>
    <text x="92" y="196" class="ah">Locker</text>
    <text x="92" y="218" class="am">deposit(asset, amount, lock?, referrer)</text>
    <text x="92" y="234" class="ap">lock() · claim() unvoted</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="448" y="168" width="340" height="80" rx="4" fill="#0e7490"/>
    <text x="464" y="196" class="h">GRAI</text>
    <text x="464" y="218" class="p">fund share · lock / vote / bribe</text>
    <text x="464" y="234" class="p">Dutch · book NAV · quorum</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="868" y="168" width="340" height="80" rx="4" fill="#4338ca"/>
    <text x="884" y="196" class="h">Custodian</text>
    <text x="884" y="218" class="p">NFT wallet · Swap / CoW / LiFi</text>
    <text x="884" y="234" class="p">trade base / quote</text>
  </g>

  <line x1="198" y1="168" x2="198" y2="116" class="wire" marker-end="url(#arrow)"/>
  <rect x="204" y="134" width="36" height="16" rx="4" fill="#fafbfc"/>
  <text x="222" y="146" text-anchor="middle" class="flow">vote()</text>

  <line x1="368" y1="208" x2="444" y2="208" class="wire" marker-end="url(#arrow)"/>
  <rect x="368" y="182" width="80" height="16" rx="4" fill="#fafbfc"/>
  <text x="408" y="194" text-anchor="middle" class="flow">deposit(assets)</text>

  <path d="M 28 208 Q 14 208 14 220 L 14 472 Q 14 484 28 484" class="wire" marker-end="url(#arrow)"/>
  <rect x="18" y="388" width="54" height="16" rx="4" fill="#fafbfc"/>
  <text x="45" y="400" text-anchor="middle" class="flow">referrer</text>

  <line x1="1038" y1="112" x2="1038" y2="164" class="wire" marker-end="url(#arrow)"/>
  <rect x="1044" y="130" width="52" height="16" rx="4" fill="#fafbfc"/>
  <text x="1070" y="142" text-anchor="middle" class="flow">allocate</text>

  <path d="M 768 168 L 768 148 Q 768 140 776 140 L 844 140 Q 852 140 852 70 L 864 70" class="wire" marker-end="url(#arrow)"/>
  <rect x="772" y="116" width="92" height="16" rx="4" fill="#fafbfc"/>
  <text x="818" y="128" text-anchor="middle" class="flow">transfer(assets)</text>

  <line x1="868" y1="218" x2="792" y2="218" class="wire" marker-end="url(#arrow)"/>
  <rect x="778" y="190" width="100" height="16" rx="4" fill="#fafbfc"/>
  <text x="828" y="202" text-anchor="middle" class="flow">distribute(yield)</text>

  <line x1="90" y1="248" x2="90" y2="304" class="wire" marker-end="url(#arrow)"/>
  <rect x="96" y="264" width="44" height="16" rx="4" fill="#fafbfc"/>
  <text x="118" y="276" text-anchor="middle" class="flow">claim()</text>

  <path d="M 618 248 L 618 276 Q 618 284 606 284 L 210 284 Q 198 284 198 304" class="wire" marker-end="url(#arrow)"/>
  <path d="M 618 248 L 618 304" class="wire" marker-end="url(#arrow)"/>
  <path d="M 618 248 L 618 276 Q 618 284 630 284 L 1026 284 Q 1038 284 1038 304" class="wire" marker-end="url(#arrow)"/>
  <rect x="340" y="270" width="64" height="16" rx="4" fill="#fafbfc"/>
  <text x="372" y="282" text-anchor="middle" class="flow">dividends</text>
  <rect x="626" y="252" width="56" height="16" rx="4" fill="#fafbfc"/>
  <text x="654" y="264" text-anchor="middle" class="flow">buyback</text>
  <rect x="920" y="270" width="54" height="16" rx="4" fill="#fafbfc"/>
  <text x="947" y="282" text-anchor="middle" class="flow">treasury</text>

  <rect x="28" y="308" width="340" height="64" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="198" y="332" text-anchor="middle" class="pct">33.33%</text>
  <text x="198" y="352" text-anchor="middle" class="cut">dividends → Locker</text>

  <rect x="448" y="308" width="340" height="64" rx="8" fill="#ffedd5" stroke="#fdba74"/>
  <text x="618" y="332" text-anchor="middle" class="pct">33.34%</text>
  <text x="618" y="352" text-anchor="middle" class="cut">buyback → Dutch Auction</text>

  <rect x="868" y="308" width="340" height="64" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="1038" y="332" text-anchor="middle" class="pct">33.33%</text>
  <text x="1038" y="352" text-anchor="middle" class="cut">treasury → Treasury</text>

  <g filter="url(#shadow)">
    <rect x="28" y="436" width="340" height="96" rx="32" fill="#fdf2f8" stroke="#db2777"/>
    <use href="#human" x="44" y="456" fill="#db2777"/>
    <text x="92" y="466" class="ah">Referrer</text>
    <text x="92" y="488" class="am">referrerOf(locker)</text>
    <text x="92" y="504" class="ap">L1 / L2 · paid on claim</text>
    <text x="92" y="520" class="ap">ownerOf(cashflow NFT)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="448" y="436" width="340" height="96" rx="32" fill="#ecfdf5" stroke="#065f46"/>
    <use href="#human" x="464" y="456" fill="#065f46"/>
    <text x="512" y="466" class="ah">Poacher</text>
    <text x="512" y="488" class="am">poach(locker)</text>
    <text x="512" y="504" class="ap">GRAI ask → referrer</text>
    <text x="512" y="520" class="ap">rebind tree, not NFT</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="868" y="436" width="340" height="80" rx="4" fill="#334155"/>
    <text x="884" y="464" class="h">Treasury</text>
    <text x="884" y="486" class="p">fee sink · cashflow NFTs</text>
    <text x="884" y="502" class="p">splits on locker claim</text>
  </g>

  <line x1="1038" y1="372" x2="1038" y2="432" class="wire" marker-end="url(#arrow)"/>

  <line x1="448" y1="476" x2="372" y2="476" fill="none" stroke="#065f46" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <rect x="388" y="454" width="40" height="16" rx="4" fill="#fafbfc"/>
  <text x="408" y="466" text-anchor="middle" class="flowg">poach</text>

  <path d="M 1038 516 L 1038 540 Q 1038 548 1026 548 L 210 548 Q 198 548 198 536" class="wire" marker-end="url(#arrow)"/>
  <rect x="528" y="534" width="88" height="16" rx="4" fill="#fafbfc"/>
  <text x="572" y="546" text-anchor="middle" class="flow">revshare ~3.33%</text>

  <g filter="url(#shadow)">
    <rect x="868" y="576" width="340" height="72" rx="4" fill="#047857"/>
    <text x="884" y="604" class="h">Beneficiar</text>
    <text x="884" y="626" class="p">~30% surplus after revshare</text>
  </g>

  <line x1="1038" y1="516" x2="1038" y2="572" class="wire" marker-end="url(#arrow)"/>
  <rect x="1044" y="536" width="36" height="16" rx="4" fill="#fafbfc"/>
  <text x="1062" y="548" text-anchor="middle" class="flow">rest</text>

  <path d="M 1038 648 L 1038 668 Q 1038 676 1026 676 L 972 676 Q 950 676 950 700" class="wire" marker-end="url(#arrow)"/>
  <path d="M 1038 648 L 1038 668 Q 1038 676 1050 676 L 1104 676 Q 1126 676 1126 700" class="wire" marker-end="url(#arrow)"/>
  <rect x="896" y="660" width="52" height="16" rx="4" fill="#fafbfc"/>
  <text x="922" y="672" text-anchor="middle" class="flow">buy GRS</text>
  <rect x="1080" y="660" width="44" height="16" rx="4" fill="#fafbfc"/>
  <text x="1102" y="672" text-anchor="middle" class="flow">owner</text>

  <path d="M 868 624 L 120 624 L 120 532" class="wireg" marker-end="url(#arrowGreen)"/>
  <rect x="168" y="632" width="132" height="16" rx="4" fill="#fafbfc"/>
  <text x="234" y="644" text-anchor="middle" class="flowg">GRS revenue rewards</text>

  <g filter="url(#shadow)">
    <rect x="868" y="704" width="164" height="56" rx="4" fill="#065f46"/>
    <text x="884" y="728" class="h">GRS/ETH</text>
    <text x="884" y="746" class="p">market buy GRS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1044" y="704" width="164" height="56" rx="4" fill="#1e1b2e"/>
    <text x="1060" y="728" class="h">Owner</text>
    <text x="1060" y="746" class="p">admin income</text>
  </g>

  <text x="618" y="792" text-anchor="middle" class="note">Same address can be locker and voter — roles are escrow states, not separate accounts.</text>
  <text x="618" y="808" text-anchor="middle" class="note">bribe buys voted GRAI. poach buys the upline seat (rebind referrerOf). OTC NFT transfer moves claim pay, not the tree.</text>
</svg>
